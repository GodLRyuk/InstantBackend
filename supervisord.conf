[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
user=root

[program:daphne]
command=/app/.venv/bin/daphne -b 0.0.0.0 -p 8080 config.asgi:application
directory=/app
autostart=true
autorestart=true
stderr_logfile=/tmp/daphne.err.log
stdout_logfile=/tmp/daphne.out.log

[program:celery]
command=/app/.venv/bin/celery -A config worker --loglevel=info --pool=solo --concurrency=1 --without-gossip --without-mingle --without-heartbeat
directory=/app
autostart=true
autorestart=true
stopwaitsecs=60
stderr_logfile=/tmp/celery.err.log
stdout_logfile=/tmp/celery.out.log